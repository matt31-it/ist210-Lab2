{% extends 'base.html' %}
{% block title %}Add New Student - IST 210 Lab 2{% endblock %}

{% block content %}
<div class=\"row justify-content-center\">
    <div class=\"col-lg-7 col-xl-6\">
        <div class=\"card border-0 shadow-sm rounded-4\">
            <div class=\"card-header bg-white border-0 pt-4 pb-0 px-4\">
                <div class=\"d-flex align-items-center gap-3\">
                    <a href=\"{{ url_for('students_list') }}\" class=\"btn btn-outline-secondary btn-sm rounded-circle p-2\">
                        <i class=\"bi bi-arrow-left\"></i>
                    </a>
                    <div>
                        <h4 class=\"fw-bold mb-1 text-dark\">
                            <i class=\"bi bi-person-plus-fill text-primary me-2\"></i>Register New Student
                        </h4>
                        <p class=\"text-muted small mb-0\">
                            Inserts into base table <code>Person</code> and child table <code>Student</code> (linking via generated <code>PersonId</code>).
                        </p>
                    </div>
                </div>
            </div>

            <div class=\"card-body p-4\">
                <form method=\"POST\">
                    <div class=\"row g-3 mb-3\">
                        <div class=\"col-md-5\">
                            <label for=\"first_name\" class=\"form-label fw-semibold text-dark\">First Name</label>
                            <input type=\"text\" class=\"form-control rounded-3\" id=\"first_name\" name=\"first_name\" placeholder=\"e.g. Alex\" required>
                        </div>
                        <div class=\"col-md-2\">
                            <label for=\"middle_initial\" class=\"form-label fw-semibold text-dark\">M.I.</label>
                            <input type=\"text\" class=\"form-control rounded-3\" id=\"middle_initial\" name=\"middle_initial\" maxlength=\"10\" placeholder=\"e.g. J\">
                        </div>
                        <div class=\"col-md-5\">
                            <label for=\"last_name\" class=\"form-label fw-semibold text-dark\">Last Name</label>
                            <input type=\"text\" class=\"form-control rounded-3\" id=\"last_name\" name=\"last_name\" placeholder=\"e.g. Rivera\" required>
                        </div>
                    </div>

                    <div class=\"mb-3\">
                        <label for=\"dob\" class=\"form-label fw-semibold text-dark\">Date of Birth</label>
                        <input type=\"date\" class=\"form-control rounded-3\" id=\"dob\" name=\"dob\" required>
                    </div>

                    <div class=\"mb-4\">
                        <label for=\"email\" class=\"form-label fw-semibold text-dark\">University Email</label>
                        <div class=\"input-group\">
                            <span class=\"input-group-text rounded-start-3\"><i class=\"bi bi-envelope\"></i></span>
                            <input type=\"email\" class=\"form-control rounded-end-3\" id=\"email\" name=\"email\" placeholder=\"e.g. ajr5001@psu.edu\" required>
                        </div>
                    </div>

                    <div class=\"d-flex justify-content-between align-items-center pt-3 border-top\">
                        <a href=\"{{ url_for('students_list') }}\" class=\"btn btn-light rounded-pill px-4\">Cancel</a>
                        <button type=\"submit\" class=\"btn btn-primary rounded-pill px-4\">
                            <i class=\"bi bi-person-check-fill me-1\"></i> Save Student
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
